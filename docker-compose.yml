services:
  siamtel_web:
    build:
      context: .
      dockerfile: php.dockerfile
    container_name: siamtel_web
    restart: always
    depends_on:
      - siamtel_db
    ports:
      - "${WEB_PORT}:80"
    develop:
      watch:
        - action: sync
          path: ./app
          target: /var/www/html/app
        - action: sync
          path: ./public
          target: /var/www/html/public
        - action: sync
          path: ./config
          target: /var/www/html/config
        # Si modificas el Dockerfile o el composer.json, reconstruye la imagen
        - action: rebuild
          path: php.dockerfile
        - action: rebuild
          path: composer.json

  siamtel_db:
    image: mariadb:10.11
    container_name: siamtel_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - siamtel_mariadb_data:/var/lib/mysql

volumes:
  siamtel_mariadb_data: