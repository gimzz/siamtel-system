version: '3.8'

services:
  db:
    image: mariadb:10.11 
    container_name: siamtel_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_siamtel 
      MYSQL_DATABASE: siamtel_db
      MYSQL_USER: siamtel_user
      MYSQL_PASSWORD: user_siamtel_password 
    ports:
      - "3306:3306" 
    volumes:
      - db_data:/var/lib/mysql 

  web:
    image: php:8.2-apache 
    container_name: siamtel_web
    restart: always
    ports:
      - "8080:80" 
    volumes:
      - ./src:/var/www/html 
    depends_on:
      - db 

volumes:
  db_data: